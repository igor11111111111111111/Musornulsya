<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Musornulsya</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1c1f26;
      }

      /* Канвас занимает всё окно и перерисовывается при его изменении. */
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #1c1f26;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8b90a0;
        font: 16px/1.5 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Загрузка…</div>

    <script src="Build/docs.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");

      // Размер буфера рендера подгоняем под реальный размер окна,
      // иначе картинка растягивалась бы из фиксированных 1280x720.
      function resize() {
        var ratio = window.devicePixelRatio || 1;
        canvas.width = Math.floor(window.innerWidth * ratio);
        canvas.height = Math.floor(window.innerHeight * ratio);
      }

      resize();
      window.addEventListener("resize", resize);

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/docs.data",
        frameworkUrl: "Build/docs.framework.js",
        codeUrl: "Build/docs.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Musornulsya",
        productVersion: "1.0",

        // Новый способ сохранения PlayerPrefs: без этого флага Unity
        // синхронизирует их вручную и пишет в консоль предупреждение
        // об устаревшем JS_FileSystem_Sync на каждое сохранение.
        autoSyncPersistentDataPath: true,
      }, function (progress) {
        loading.textContent = "Загрузка… " + Math.round(progress * 100) + "%";
      }).then(function () {
        loading.remove();
      }).catch(function (message) {
        loading.textContent = "Не удалось загрузить игру: " + message;
      });
    </script>
  </body>
</html>
